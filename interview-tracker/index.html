<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <title>面試追蹤</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar hidden" id="topbar">
    <div class="topbar-inner">
      <div class="brand">面試<span>追蹤</span></div>
      <nav class="tabs" id="tabs">
        <button class="tab" data-view="timeline">時間軸</button>
        <button class="tab" data-view="board">看板</button>
        <button class="tab" data-view="prep">準備紀錄</button>
        <button class="tab" data-view="stats">統計</button>
      </nav>
      <div class="actions">
        <button class="btn primary sm" id="btn-new-app">＋ 應徵</button>
        <button class="btn sm" id="btn-new-prep">＋ 練習</button>
        <a class="btn ghost sm" href="share.html" target="_blank" rel="noopener">分享頁</a>
        <button class="btn ghost sm" id="btn-export">匯出</button>
        <button class="btn ghost sm" id="btn-theme">淺色</button>
        <button class="btn ghost sm" id="btn-logout">登出</button>
      </div>
    </div>
  </header>

  <main id="main"><p class="muted">載入中…</p></main>

  <dialog id="dlg"></dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
