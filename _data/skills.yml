# 技能區塊資料。每個 group 會依序渲染成一個類別。
# style: tag    → 實心標籤（tag-list）— 用於核心技術能力
# style: method → 外框標籤（method-list）— 用於研究方法
groups:
  - title: "程式語言 / Programming"
    style: tag
    items:
      - Python
      - R
      - MATLAB
      - SQL
      - Shell
      - TypeScript
      - JavaScript

  - title: "機器學習 / Machine Learning"
    style: tag
    items:
      - Supervised Learning
      - Classification & Regression
      - XGBoost
      - Graph Neural Networks
      - Time-Series Analysis
      - Anomaly Detection
      - Imbalanced Classification
      - Concept Drift
      - Information-Theoretic Features (Entropy, JS Divergence)

  - title: "AI 與 LLM / AI & LLM"
    style: tag
    items:
      - RAG (Retrieval-Augmented Generation)
      - Embeddings & Semantic Search
      - Hybrid Search (Dense + BM25, RRF)
      - Prompt & Context Engineering
      - Multi-Agent Systems
      - Local LLM Deployment (Ollama)
      - Knowledge Graphs
      - NLP / Text Classification
      - Chinese NLP
      - Claude Code

  - title: "LLM 評估 / LLM Evaluation"
    style: tag
    items:
      - RAG Retrieval Metrics (Hit@k, MRR)
      - Citation Grounding & Precision
      - Hallucination Evaluation
      - LLM-as-Judge & Judge Validation
      - LLM Data Labeling with Human Validation

  - title: "電腦視覺與訊號處理 / Computer Vision & Signal"
    style: tag
    items:
      - OpenCV
      - YOLOv8
      - HOG Features
      - Object Detection
      - Signal Processing
      - Multimodal Feature Extraction

  - title: "資料工程 / Data Engineering"
    style: tag
    items:
      - Feature Engineering
      - Data Preprocessing & QC Pipelines
      - Pipeline Development
      - Cross-Site Data Integration
      - Database Management (Shell/SQL)
      - Vector Databases (ChromaDB)
      - APIs & Webhooks (FastAPI)
      - Scheduled Pipelines & Automated Reporting

  - title: "Web 開發 / Web Development"
    style: tag
    items:
      - Next.js / React
      - NestJS (Node.js)
      - PostgreSQL & TypeORM
      - OAuth Login (Google)
      - Payment Gateway Integration
      - Docker & Nginx Deployment
      - CI/CD (GitHub Actions)

  - title: "評估與統計 / Evaluation & Statistics"
    style: tag
    items:
      - Experimental Design
      - Statistical Modeling
      - Model Calibration (Brier Score)
      - Leakage-Safe Temporal Splits
      - Confidence Intervals (Wilson, Block Bootstrap)
      - LLM–Human Label Agreement (Cohen's Kappa)
      - Synthetic Benchmarks with Planted Ground Truth
      - Ablation Studies

  - title: "量化研究 / Quantitative Research"
    style: tag
    items:
      - Walk-Forward Backtesting
      - Information Coefficient (IC)
      - Survivorship-Bias-Free Universes
      - Sector-Neutral Portfolios
      - Overfitting Controls (Out-of-Sample, Deflated Sharpe)
      - Pre-Registered Forward Validation

  - title: "研究方法 / Research Methods"
    style: method
    items:
      - "fMRI (Functional Magnetic Resonance Imaging) Data Analysis"
      - "Virtual Reality (VR) Experimental Design"
      - "Cross-Cultural / Cross-National Study Design"
      - "Behavioral Data Processing"
