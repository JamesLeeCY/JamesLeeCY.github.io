<div class="skills-section">
    {% for group in site.data.skills.groups %}
    <div class="skills-group">
        <h4>{{ group.title }}</h4>
        <ul class="{% if group.style == 'method' %}method-list{% else %}tag-list{% endif %}">
            {% for item in group.items %}
            <li>{{ item }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endfor %}
</div>
